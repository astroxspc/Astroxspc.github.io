<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrox Space Journal</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #0b1d3a 0%, #000 70%);
  color: white;
}

/* STAR FIELD */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: twinkle infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* BLACK HOLE */
.blackhole {
  position: absolute;
  width: 280px;
  height: 280px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, black 55%, #3a0066 70%, transparent 80%);
  box-shadow: 0 0 120px #7a00ff;
  animation: rotate 12s linear infinite;
}

@keyframes rotate {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* REALISTIC PLANET */
.planet {
  position: absolute;
  border-radius: 50%;
  overflow: hidden;
}

.planet::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%);
}

.planet::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 70% 70%, rgba(0,0,0,0.8), transparent 70%);
}

/* Blue Planet */
.blue {
  width: 180px;
  height: 180px;
  left: 8%;
  top: 25%;
  background: radial-gradient(circle at 40% 40%, #4cc9f0, #001d3d);
  box-shadow: 0 0 40px rgba(0,150,255,0.4);
}

/* Orange Planet */
.orange {
  width: 140px;
  height: 140px;
  right: 8%;
  bottom: 20%;
  background: radial-gradient(circle at 40% 40%, #ffb703, #7b2d00);
  box-shadow: 0 0 40px rgba(255,140,0,0.4);
}

/* TITLE */
h1 {
  position: absolute;
  top: 40px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  letter-spacing: 4px;
  text-shadow: 0 0 20px cyan;
}
</style>
</head>

<body>

<h1>ASTROX SPACE JOURNAL</h1>

<div class="planet blue"></div>
<div class="planet orange"></div>
<div class="blackhole"></div>

<script>
for (let i = 0; i < 250; i++) {
  let star = document.createElement("div");
  star.className = "star";
  let size = Math.random() * 2;
  star.style.width = size + "px";
  star.style.height = size + "px";
  star.style.top = Math.random() * 100 + "vh";
  star.style.left = Math.random() * 100 + "vw";
  star.style.animationDuration = (Math.random() * 3 + 1) + "s";
  document.body.appendChild(star);
}
</script>

</body>
</html>
