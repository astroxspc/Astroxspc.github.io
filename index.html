<!DOCTYPE html>
<html>
<head>
  <title>Astrox Space Journal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at bottom, #0b0f1a 0%, #000000 100%);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    /* Bintang */
    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      background: transparent;
      box-shadow:
        50px 80px white,
        200px 150px white,
        400px 50px white,
        600px 200px white,
        800px 120px white,
        1000px 300px white,
        1200px 90px white,
        1400px 220px white;
      animation: twinkle 3s infinite alternate;
      z-index: -1;
    }

    @keyframes twinkle {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* Planet */
    .planet {
      position: absolute;
      top: 80px;
      right: 50px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle at 30% 30%, #4da6ff, #001f4d);
      border-radius: 50%;
      box-shadow: 0 0 40px #4da6ff;
    }

    /* Judul */
    h1 {
      font-size: 42px;
      margin-top: 120px;
      text-align: center;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #9aa7c2;
      margin-bottom: 40px;
    }

    /* Card Jurnal */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      margin: 20px auto;
      padding: 20px;
      width: 80%;
      border-radius: 15px;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #4da6ff;
    }

    a {
      text-decoration: none;
      color: #66ccff;
      font-size: 18px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="stars"></div>
  <div class="planet"></div>

  <h1>Astrox Space Journal</h1>
  <div class="subtitle">Exploring Thoughts Beyond Earth</div>

  <div class="card">
    <a href="jurnal1.html">🌌 Jurnal Pertama Saya</a>
  </div>

  <footer>
    © 2026 Astrox Space Journal | Crafted in the Cosmos
  </footer>

</body>
</html>
