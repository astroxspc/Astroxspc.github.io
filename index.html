<!DOCTYPE html>
<html>
<head>
<title>Astrox Space Journal</title>
<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

/* Bintang */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    animation: blink 2s infinite alternate;
}

@keyframes blink {
    from {opacity: 0.2;}
    to {opacity: 1;}
}

/* Planet */
.planet {
    position: absolute;
    border-radius: 50%;
    animation: spin 20s linear infinite;
}

.planet1 {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at 30% 30%, #3af, #015);
    top: 20%;
    left: 10%;
}

.planet2 {
    width: 80px;
    height: 80px;
    background: radial-gradient(circle at 30% 30%, #f93, #400);
    bottom: 15%;
    right: 15%;
}

@keyframes spin {
    from {transform: rotate(0deg);}
    to {transform: rotate(360deg);}
}

/* Black Hole */
.blackhole {
    position: absolute;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle, black 40%, purple 60%, transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: vortex 5s linear infinite;
}

@keyframes vortex {
    from {transform: translate(-50%, -50%) rotate(0deg);}
    to {transform: translate(-50%, -50%) rotate(360deg);}
}

/* Judul */
h1 {
    position: relative;
    margin-top: 40px;
    font-size: 40px;
    text-shadow: 0 0 20px cyan;
}
</style>
</head>

<body>

<h1>ASTROX SPACE JOURNAL</h1>

<div class="planet planet1"></div>
<div class="planet planet2"></div>
<div class="blackhole"></div>

<script>
for (let i = 0; i < 200; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random() * 100 + "vh";
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDuration = (Math.random() * 3 + 1) + "s";
    document.body.appendChild(star);
}
</script>

</body>
</html>
