<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrox Space Journal</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
}

/* Smooth Galaxy Background */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #0a1f3c 0%, #000 70%);
    z-index: -2;
}

/* Nebula Glow */
body::after {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(128,0,255,0.25), transparent 70%);
    top: 30%;
    left: 20%;
    filter: blur(100px);
    z-index: -1;
}

/* Stars */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle infinite alternate;
}

@keyframes twinkle {
    from {opacity: 0.3;}
    to {opacity: 1;}
}

/* Planets */
.planet {
    position: absolute;
    border-radius: 50%;
    box-shadow: inset -20px -20px 50px rgba(0,0,0,0.7),
                0 0 40px rgba(255,255,255,0.15);
}

.planet1 {
    width: 140px;
    height: 140px;
    background: radial-gradient(circle at 30% 30%, #4cc9f0, #03045e);
    top: 15%;
    left: 8%;
}

.planet2 {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle at 40% 40%, #ff9e00, #7b2d00);
    bottom: 15%;
    right: 8%;
}

/* Black Hole */
.blackhole {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, black 45%, purple 65%, transparent 75%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rotate 8s linear infinite;
    box-shadow: 0 0 60px purple;
}

@keyframes rotate {
    from {transform: translate(-50%, -50%) rotate(0deg);}
    to {transform: translate(-50%, -50%) rotate(360deg);}
}

/* Title */
h1 {
    text-align: center;
    margin-top: 30px;
    font-size: 26px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px cyan, 0 0 30px blue;
}
</style>
</head>

<body>

<h1>ASTROX SPACE JOURNAL</h1>

<div class="planet planet1"></div>
<div class="planet planet2"></div>
<div class="blackhole"></div>

<script>
for (let i = 0; i < 300; i++) {
    let star = document.createElement("div");
    star.className = "star";
    let size = Math.random() * 3;
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.top = Math.random() * 100 + "vh";
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDuration = (Math.random() * 3 + 1) + "s";
    document.body.appendChild(star);
}
</script>

</body>
</html>
