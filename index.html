<!DOCTYPE html>
<html>
<head>
<title>Astrox Space Journal</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
    color: white;
    text-align: center;
}

/* STAR FIELD */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle infinite alternate;
}

@keyframes twinkle {
    from {opacity: 0.2;}
    to {opacity: 1;}
}

/* NEBULA GLOW */
.nebula {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(128,0,255,0.2), transparent 70%);
    top: 20%;
    left: 30%;
    filter: blur(80px);
}

/* PLANETS */
.planet {
    position: absolute;
    border-radius: 50%;
    box-shadow: inset -20px -20px 50px rgba(0,0,0,0.7),
                0 0 40px rgba(255,255,255,0.2);
}

.planet1 {
    width: 140px;
    height: 140px;
    background: radial-gradient(circle at 30% 30%, #4cc9f0, #03045e);
    top: 15%;
    left: 10%;
}

.planet2 {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle at 40% 40%, #ff9e00, #7b2d00);
    bottom: 15%;
    right: 10%;
}

/* BLACK HOLE */
.blackhole {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, black 40%, purple 65%, transparent 75%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rotate 6s linear infinite;
    box-shadow: 0 0 60px purple;
}

@keyframes rotate {
    from {transform: translate(-50%, -50%) rotate(0deg);}
    to {transform: translate(-50%, -50%) rotate(360deg);}
}

/* TITLE */
h1 {
    margin-top: 30px;
    font-size: 28px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px cyan, 0 0 30px blue;
}
</style>
</head>

<body>

<h1>ASTRO XSPACE JOURNAL</h1>

<div class="nebula"></div>
<div class="planet planet1"></div>
<div class="planet planet2"></div>
<div class="blackhole"></div>

<script>
for (let i = 0; i < 300; i++) {
    let star = document.createElement("div");
    star.className = "star";
    let size = Math.random() * 3;
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.top = Math.random() * 100 + "vh";
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDuration = (Math.random() * 3 + 1) + "s";
    document.body.appendChild(star);
}
</script>

</body>
</html>
